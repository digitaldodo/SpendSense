services:
  postgres:
    image: postgres:17
    container_name: spendsense-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendsense-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-spendsense}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spendsense} -d ${POSTGRES_DB:-spendsense}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
