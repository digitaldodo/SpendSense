spring:
  application:
    name: SpendSense API
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://spendsense:spendsense-local-password@localhost:27017/spendsense?authSource=admin}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spendsense:
  api:
    version: v1
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  security:
    jwt:
      issuer: ${JWT_ISSUER:spendsense}
      access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    display-request-duration: true
  show-actuator: false
