spring:
  application:
    name: SpendSense API
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/spendsense}
    username: ${DATABASE_USERNAME:spendsense}
    password: ${DATABASE_PASSWORD:spendsense-local-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spendsense:
  api:
    version: v1
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  security:
    supabase:
      issuer: ${SUPABASE_JWT_ISSUER:http://localhost:54321/auth/v1}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
      jwks-uri: ${SUPABASE_JWKS_URI:}
      jwt-secret: ${SUPABASE_JWT_SECRET:}
  cors:
    allowed-origins:
      - ${WEB_ORIGIN:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    display-request-duration: true
  show-actuator: false
