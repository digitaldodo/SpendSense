spring:
  application:
    name: SpendSense API
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/spendsense}
    username: ${DATABASE_USERNAME:spendsense}
    password: ${DATABASE_PASSWORD:spendsense-local-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spendsense:
  api:
    version: v1
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  security:
    supabase:
      issuer: ${SUPABASE_JWT_ISSUER:http://localhost:54321/auth/v1}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
      jwks-uri: ${SUPABASE_JWKS_URI:}
      jwt-secret: ${SUPABASE_JWT_SECRET:}
    headers:
      content-security-policy: ${SPENDSENSE_API_CSP:default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'}
      permissions-policy: ${SPENDSENSE_PERMISSIONS_POLICY:camera=(), microphone=(), geolocation=(), payment=()}
    rate-limit:
      enabled: ${SPENDSENSE_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${SPENDSENSE_RATE_LIMIT_REQUESTS_PER_MINUTE:120}
      burst-capacity: ${SPENDSENSE_RATE_LIMIT_BURST_CAPACITY:120}
  cors:
    allowed-origins:
      - ${WEB_ORIGIN:http://localhost:3000}
  demo:
    enabled: ${SPENDSENSE_DEMO_ENABLED:false}
  delivery:
    worker:
      batch-size: ${SPENDSENSE_WORKER_BATCH_SIZE:100}
      retry-delay-seconds: ${SPENDSENSE_WORKER_RETRY_DELAY_SECONDS:300}
      lock-ttl-seconds: ${SPENDSENSE_WORKER_LOCK_TTL_SECONDS:120}
      cleanup-retention-days: ${SPENDSENSE_WORKER_CLEANUP_RETENTION_DAYS:30}
    email:
      primary-provider: ${SPENDSENSE_EMAIL_PRIMARY_PROVIDER:RESEND}
      resend:
        enabled: ${RESEND_ENABLED:false}
        api-key: ${RESEND_API_KEY:}
        from-email: ${RESEND_FROM_EMAIL:no-reply@spendsense.local}
        from-name: ${RESEND_FROM_NAME:SpendSense}
      smtp:
        enabled: ${SMTP_ENABLED:false}
        from-email: ${SMTP_FROM_EMAIL:no-reply@spendsense.local}
        from-name: ${SMTP_FROM_NAME:SpendSense}
    webhooks:
      require-signature: ${SPENDSENSE_WEBHOOK_REQUIRE_SIGNATURE:false}
      resend-secret: ${RESEND_WEBHOOK_SECRET:}
      smtp-fallback-secret: ${SMTP_FALLBACK_WEBHOOK_SECRET:}
      push-provider-secret: ${PUSH_PROVIDER_WEBHOOK_SECRET:}
      replay-window-seconds: ${SPENDSENSE_WEBHOOK_REPLAY_WINDOW_SECONDS:300}
  performance:
    slow-request-threshold-ms: ${SPENDSENSE_SLOW_REQUEST_THRESHOLD_MS:750}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    display-request-duration: true
  show-actuator: false
