server:
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:200}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:10}

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_SHUTDOWN_TIMEOUT:30s}
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
      leak-detection-threshold: ${DATABASE_LEAK_DETECTION_THRESHOLD_MS:0}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    connect-retries: ${FLYWAY_CONNECT_RETRIES:5}
  jpa:
    show-sql: false

logging:
  level:
    com.spendsense.api: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: "{\"ts\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}\",\"level\":\"%level\",\"service\":\"spendsense-api\",\"traceId\":\"%X{traceId:-}\",\"correlationId\":\"%X{correlationId:-}\",\"logger\":\"%logger{36}\",\"message\":\"%replace(%msg){'\"','\\\"'}\",\"thread\":\"%thread\"}%n%wEx"

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

spendsense:
  demo:
    enabled: false
  security:
    rate-limit:
      enabled: true
  delivery:
    worker-delay-ms: ${SPENDSENSE_WORKER_DELAY_MS:300000}
