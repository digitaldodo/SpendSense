server:
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:120}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:8}

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_SHUTDOWN_TIMEOUT:30s}
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:6}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    connect-retries: ${FLYWAY_CONNECT_RETRIES:5}
  jpa:
    show-sql: false

logging:
  level:
    com.spendsense.api: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: "{\"ts\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}\",\"level\":\"%level\",\"service\":\"spendsense-api\",\"env\":\"staging\",\"traceId\":\"%X{traceId:-}\",\"correlationId\":\"%X{correlationId:-}\",\"logger\":\"%logger{36}\",\"message\":\"%replace(%msg){'\"','\\\"'}\",\"thread\":\"%thread\"}%n%wEx"

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

spendsense:
  demo:
    enabled: false
  security:
    rate-limit:
      enabled: true
  delivery:
    webhooks:
      require-signature: ${SPENDSENSE_WEBHOOK_REQUIRE_SIGNATURE:true}
