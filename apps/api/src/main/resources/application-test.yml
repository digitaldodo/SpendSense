spring:
  datasource:
    url: jdbc:h2:mem:spendsense;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

spendsense:
  security:
    supabase:
      issuer: http://localhost:54321/auth/v1
      audience: authenticated
      jwks-uri:
      jwt-secret: test-secret-at-least-thirty-two-characters
  cors:
    allowed-origins:
      - http://localhost:3000
