name: Preview deployment

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vercel-preview:
    name: frontend preview
    runs-on: ubuntu-latest
    environment: preview
    if: ${{ secrets.VERCEL_TOKEN != '' && vars.VERCEL_PROJECT_ID != '' && vars.VERCEL_ORG_ID != '' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build preview frontend
        env:
          NEXT_PUBLIC_APP_ENV: development
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          NEXT_PUBLIC_ENABLE_E2E_AUTH_BYPASS: "1"
          SPENDSENSE_ENABLE_CI_MOCK_API: "1"
        run: npm --prefix apps/web run build
      - name: Deploy Vercel preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: npx vercel deploy apps/web --token "$VERCEL_TOKEN" > preview-url.txt
      - name: Publish preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const url = fs.readFileSync("preview-url.txt", "utf8").trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `SpendSense preview deployment: ${url}`
            });
