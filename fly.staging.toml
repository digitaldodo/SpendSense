app = "spendsense-api-staging"
primary_region = "bom"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "staging"
  SPENDSENSE_ENVIRONMENT = "staging"
  SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/v1/health/ready"
